# Gaya terminal me-shell untuk kitty (Nothing / TE, ala Caelestia).
# Di-include dari kitty.conf oleh installer. Setting yang ditulis SESUDAH baris include di kitty.conf
# menang, jadi ubahan pribadi taruh di bawahnya.

# Huruf
font_family             JetBrains Mono
bold_font               auto
italic_font             auto
font_size               11.5
disable_ligatures       cursor
modify_font             cell_height 112%

# Kursor garis tipis dengan jejak saat melompat jauh
cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.6
cursor_stop_blinking_after 10
cursor_trail            3
cursor_trail_decay      0.08 0.3
cursor_trail_start_threshold 3

# Jendela: lega, transparan (diburamkan Hyprland), tanpa dekorasi
window_padding_width    20 24
background_opacity      0.86
dynamic_background_opacity yes
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    no
initial_window_width    96c
initial_window_height   28c
draw_minimal_borders    yes
window_border_width     1px
inactive_text_alpha     0.8

# Tab bernomor ala TE: "01 judul", tab aktif diberi titik aksen
tab_bar_edge            top
tab_bar_style           separator
tab_separator           "    "
tab_bar_min_tabs        2
tab_bar_align           left
tab_bar_margin_width    20
tab_bar_margin_height   10 0
tab_title_max_length    28
tab_title_template      "{index:02d}  {title}"
active_tab_title_template "● {index:02d}  {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# Lain-lain
scrollback_lines        10000
enable_audio_bell       no
visual_bell_duration    0.12
url_style               straight
mouse_hide_wait         2.0
copy_on_select          clipboard
strip_trailing_spaces   smart
shell_integration       enabled

# Prompt starship bergaya me-shell (warna ikut wallpaper); hanya di dalam kitty
env STARSHIP_CONFIG=${HOME}/.local/state/me-shell/starship.toml

# Warna dari wallpaper; berganti otomatis saat wallpaper diganti
include ${HOME}/.local/state/me-shell/kitty-colors.conf
