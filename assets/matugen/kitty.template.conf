# Warna kitty dari wallpaper, dibuat matugen lewat scripts/gen-colors.sh.
# Ditimpa setiap ganti wallpaper, jadi jangan diubah di sini.
# Gaya me-shell: permukaan dan teks hampir abu-abu (seperti Appearance.neutral), satu aksen dari wallpaper,
# warna ANSI diselaraskan ke aksen supaya tidak mencolok.

foreground              {{colors.on_surface.default.hex | set_saturation: 4.0}}
background              {{colors.surface.default.hex | set_saturation: 4.0}}
selection_foreground    {{colors.on_primary.default.hex}}
selection_background    {{colors.primary.default.hex}}

cursor                  {{colors.primary.default.hex}}
cursor_text_color       {{colors.on_primary.default.hex}}
cursor_trail_color      {{colors.primary.default.hex}}
url_color               {{colors.primary.default.hex}}

active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline_variant.default.hex | set_saturation: 4.0}}
bell_border_color       {{colors.error.default.hex}}

tab_bar_background      {{colors.surface.default.hex | set_saturation: 4.0}}
tab_bar_margin_color    {{colors.surface.default.hex | set_saturation: 4.0}}
active_tab_foreground   {{colors.primary.default.hex}}
active_tab_background   {{colors.surface.default.hex | set_saturation: 4.0}}
inactive_tab_foreground {{colors.outline.default.hex | set_saturation: 4.0}}
inactive_tab_background {{colors.surface.default.hex | set_saturation: 4.0}}

mark1_foreground        {{colors.on_primary.default.hex}}
mark1_background        {{colors.primary.default.hex}}

# Hitam dan putih
color0  {{colors.surface_container_highest.default.hex | set_saturation: 4.0}}
color8  {{colors.outline.default.hex | set_saturation: 4.0}}
color7  {{colors.on_surface_variant.default.hex | set_saturation: 4.0}}
color15 {{colors.on_surface.default.hex | set_saturation: 4.0}}

# Merah, hijau, kuning, biru, magenta, cyan (normal / terang)
color1  {{colors.red.default.hex}}
color9  {{colors.on_red_container.default.hex}}
color2  {{colors.green.default.hex}}
color10 {{colors.on_green_container.default.hex}}
color3  {{colors.yellow.default.hex}}
color11 {{colors.on_yellow_container.default.hex}}
color4  {{colors.blue.default.hex}}
color12 {{colors.on_blue_container.default.hex}}
color5  {{colors.magenta.default.hex}}
color13 {{colors.on_magenta_container.default.hex}}
color6  {{colors.cyan.default.hex}}
color14 {{colors.on_cyan_container.default.hex}}
